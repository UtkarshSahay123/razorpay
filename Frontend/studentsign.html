<form id="loginForm" class="space-y-sm">
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant">mail</span>
<input class="input-field w-full h-12 pl-10 pr-3 font-body-md text-body-md bg-surface-container-lowest" id="email" name="email" placeholder="student@lumina.edu" required="" type="email"/>
</div>
</div>
<div>
<div class="flex justify-between items-center mb-xs">
<label class="block font-label-md text-label-md text-on-surface" for="password">Password</label>
<a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant">lock</span>
<input class="input-field w-full h-12 pl-10 pr-3 font-body-md text-body-md bg-surface-container-lowest" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<button class="w-full h-12 bg-primary text-on-primary font-label-md text-label-md rounded-[12px] hover:bg-primary-container active:scale-[0.98] transition-all duration-200 mt-md shadow-sm" type="submit">
                    Sign In
                </button>
</form>

<div class="mt-md text-center font-body-md text-body-md text-on-surface-variant">

</div>

</main>
<div class="fixed inset-0 z-0 overflow-hidden pointer-events-none opacity-20">
<div class="absolute -top-1/4 -right-1/4 w-[800px] h-[800px] rounded-full bg-gradient-to-br from-primary-fixed to-secondary-fixed blur-3xl opacity-50 mix-blend-multiply"></div>
<div class="absolute -bottom-1/4 -left-1/4 w-[600px] h-[600px] rounded-full bg-gradient-to-tr from-tertiary-fixed to-inverse-primary blur-3xl opacity-50 mix-blend-multiply"></div>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    
    try {
        const response = await fetch(`${API_BASE_URL}/api/auth/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });
        
        if (response.ok) {
            const data = await response.json();
            if(data.role === 'STUDENT') {
                localStorage.setItem('token', data.token);
                window.location.href = 'studentdashboard.html';
            } else {
                alert('Invalid credentials for student portal. Please use the Admin login.');
            }
        } else {
            const errorText = await response.text();
            alert('Login failed: ' + errorText);
        }
    } catch (error) {
        alert('Error connecting to server.');
    }
});
</script>
