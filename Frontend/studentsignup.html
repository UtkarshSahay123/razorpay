      <span class="material-symbols-outlined text-xl">person</span>

<main class="flex-grow flex items-center justify-center p-margin-mobile md:p-margin-desktop">
<!-- Registration Card Container -->
<div class="w-full max-w-lg bg-surface-container-lowest rounded-xl shadow-[0_8px_24px_rgba(0,0,0,0.05)] border border-surface-variant overflow-hidden flex flex-col">
<!-- Branding Header -->
<div class="p-md md:p-lg border-b border-surface-variant flex flex-col items-center text-center">
<div class="flex items-center gap-2 mb-sm text-primary">
<span class="material-symbols-outlined text-4xl" data-weight="fill" style="font-variation-settings: 'FILL' 1;">school</span>
<h1 class="font-headline-md text-headline-md font-bold tracking-tight">Lumina Education</h1>
</div>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface mt-xs">Start Your Journey</h2>
<p class="font-body-md text-body-md text-on-surface-variant mt-2 max-w-sm mx-auto">Create an account to access world-class educational resources and track your progress.</p>
</div>
<!-- Form Area -->
<div class="p-md md:p-lg flex-grow">
<form id="signupForm" class="space-y-sm">
<!-- Full Name -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="fullname">Full Name</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined">person</span>
</div>
<input autocomplete="name" class="block w-full pl-10 pr-3 py-3 border border-outline rounded-lg bg-surface-container-lowest text-on-surface focus:ring-2 focus:ring-primary/20 focus:border-primary font-body-md text-body-md transition-shadow" id="fullname" name="fullname" placeholder="Jane Doe" required="" type="text"/>
</div>
</div>
<!-- Email -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="email">Email Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined">mail</span>
</div>
<input autocomplete="email" class="block w-full pl-10 pr-3 py-3 border border-outline rounded-lg bg-surface-container-lowest text-on-surface focus:ring-2 focus:ring-primary/20 focus:border-primary font-body-md text-body-md transition-shadow" id="email" name="email" placeholder="student@lumina.edu" required="" type="email"/>
</div>
</div>
<!-- Password -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="password">Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined">lock</span>
</div>
<input class="block w-full pl-10 pr-10 py-3 border border-outline rounded-lg bg-surface-container-lowest text-on-surface focus:ring-2 focus:ring-primary/20 focus:border-primary font-body-md text-body-md transition-shadow" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<div class="absolute inset-y-0 right-0 pr-3 flex items-center cursor-pointer text-on-surface-variant hover:text-on-surface" onclick="togglePasswordVisibility()">
<span class="material-symbols-outlined" id="password-toggle-icon">visibility_off</span>
</div>
</div>
<p class="mt-2 font-caption text-caption text-on-surface-variant">Must be at least 8 characters long.</p>
</div>
<!-- Terms Checkbox -->
<div class="flex items-start mt-sm">
<div class="flex items-center h-5">
<input class="w-4 h-4 text-primary bg-surface-container-lowest border-outline rounded focus:ring-primary focus:ring-2 focus:ring-offset-0" id="terms" name="terms" required="" type="checkbox"/>
</div>
<div class="ml-3 text-sm">
<label class="font-body-md text-body-md text-on-surface-variant" for="terms">
                                I agree to the <a class="font-label-md text-label-md text-primary hover:underline" href="#">Terms &amp; Conditions</a> and <a class="font-label-md text-label-md text-primary hover:underline" href="#">Privacy Policy</a>.
                            </label>
</div>
</div>
<!-- Submit Button -->
<div class="pt-sm">
<button class="w-full flex justify-center items-center py-3 px-4 border border-transparent rounded-lg shadow-sm font-label-md text-label-md text-on-primary bg-primary hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors h-12" type="submit">
                            Create Account
                        </button>
</div>
</form>
</div>
<!-- Footer Link -->
<div class="p-md border-t border-surface-variant bg-surface-container-low text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Already have an account? 
                    <a class="font-label-md text-label-md text-primary hover:underline ml-1 font-semibold" href="#">Sign In</a>
</p>
</div>
</div>
</main>
    <script>
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('password-toggle-icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.textContent = 'visibility';
            } else {
                passwordInput.type = 'password';
                toggleIcon.textContent = 'visibility_off';
            }
        }

        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fullName = document.getElementById('fullname').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            try {
                const response = await fetch(`${API_BASE_URL}/api/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fullName, email, password, role: 'STUDENT' })
                });
                
                if (response.ok) {
                    alert('Registration successful! Please sign in.');
                    window.location.href = 'studentsign.html';
                } else {
                    const errorText = await response.text();
                    alert('Registration failed: ' + errorText);
                }
            } catch (error) {
                alert('Error connecting to server.');
            }
        });
    </script>
