<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-highest transition-colors w-16 h-14 rounded-xl" href="#">
<span class="material-symbols-outlined" data-icon="search">search</span>
<span class="font-caption text-caption mt-1">Catalog</span>
</a>
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-4 py-1 active:scale-90 transition-transform duration-200" href="#">
<span class="material-symbols-outlined icon-fill" data-icon="person">person</span>
<span class="font-caption text-caption mt-1 font-bold">Dashboard</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-highest transition-colors w-16 h-14 rounded-xl" href="#">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
<span class="font-caption text-caption mt-1">Settings</span>
</a>
</nav>
<script>
    document.addEventListener("DOMContentLoaded", async () => {
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = 'studentsign.html';
            return;
        }

        try {
            const response = await fetch(`${API_BASE_URL}/api/dashboard/student`, {
                method: 'GET',
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });

            if (response.ok) {
                const data = await response.json();
                
                document.getElementById('studentName').textContent = data.fullName;
                document.getElementById('studentEmail').textContent = data.email;
                document.getElementById('completedCourses').textContent = data.completedCourses;
                document.getElementById('hoursLearned').textContent = data.hoursLearned;
                document.getElementById('certificatesEarned').textContent = data.certificatesEarned;

                const coursesContainer = document.getElementById('coursesContainer');
                coursesContainer.innerHTML = ''; // clear existing
                
                if(data.enrolledCourses && data.enrolledCourses.length > 0) {
                    data.enrolledCourses.forEach(course => {
                        const card = `
                        <div class="bg-surface rounded-xl overflow-hidden shadow-[0_2px_8px_rgba(0,0,0,0.05)] border border-surface-container flex flex-col group hover:shadow-lg transition-all duration-300">
                            <div class="h-40 w-full relative overflow-hidden bg-surface-container-low">
                                <img alt="Course Thumbnail" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" src="${course.thumbnailUrl || 'https://lh3.googleusercontent.com/aida-public/AB6AXuC9_88VNkRjTiK_EFR_Nw7kv02y7ZY9QJeuh2NAtOVkixYSc56u5A9KT2WifSvtq5aN6KqZMBjM0DdtZrPziAMx-r3VZ6aVHt6rjT2F0wHxZ47eAX12H-Vswy7Sae88r6PEutlcKQw092vBQLJiCjelJsYBLvKZgmbadB-iqvo7gJna97oPCWmKxNHV1pyZJBBVU8YTG-49-u0JqWwwAnfgQWlzHYvlQqaJPUVNFE3zArGUfOLIVsvCbw'}"/>
                            </div>
                            <div class="p-md flex flex-col flex-grow">
                                <h3 class="font-label-md text-label-md text-on-surface mb-sm line-clamp-2">${course.title}</h3>
                                <p class="font-caption text-caption text-on-surface-variant mb-md">${course.description || 'No description available'}</p>
                                <div class="mt-auto space-y-sm">
                                    <div class="flex justify-between items-center font-caption text-caption">
                                        <span class="text-on-surface-variant">Progress</span>
                                        <span class="text-secondary font-bold">${course.progressPercentage}%</span>
                                    </div>
                                    <div class="w-full h-2 bg-surface-container-high rounded-full overflow-hidden">
                                        <div class="h-full bg-secondary rounded-full" style="width: ${course.progressPercentage}%;"></div>
                                    </div>
                                    <button class="w-full mt-sm h-12 bg-primary text-on-primary rounded-xl font-label-md text-label-md flex items-center justify-center gap-sm hover:bg-primary-container transition-colors active:scale-95 duration-150">
                                        Continue Learning
                                        <span class="material-symbols-outlined text-[18px]" data-icon="arrow_forward">arrow_forward</span>
                                    </button>
                                </div>
                            </div>
                        </div>`;
                        coursesContainer.insertAdjacentHTML('beforeend', card);
                    });
                } else {
                    coursesContainer.innerHTML = '<p class="text-on-surface-variant">You are not enrolled in any courses yet.</p>';
                }
            } else {
                console.error('Failed to fetch dashboard data');
                if (response.status === 403 || response.status === 401) {
                    localStorage.removeItem('token');
                    window.location.href = 'studentsign.html';
                }
            }
        } catch (error) {
            console.error('Error:', error);
        }
    });

    // Logout and dropdown logic
    function handleLogout(e) {
        if(e) e.preventDefault();
        localStorage.removeItem('token');
        window.location.href = 'index.html';
    }

    const profileBtnDesktop = document.getElementById('profileBtnDesktop');
    const logoutDropdownDesktop = document.getElementById('logoutDropdownDesktop');
    const logoutBtnDesktop = document.getElementById('logoutBtnDesktop');

    const profileBtnMobile = document.getElementById('profileBtnMobile');
    const logoutDropdownMobile = document.getElementById('logoutDropdownMobile');
    const logoutBtnMobile = document.getElementById('logoutBtnMobile');

    profileBtnDesktop.addEventListener('click', (e) => {
        e.stopPropagation();
        logoutDropdownDesktop.classList.toggle('hidden');
    });

    profileBtnMobile.addEventListener('click', (e) => {
        e.stopPropagation();
        logoutDropdownMobile.classList.toggle('hidden');
    });

    // Close dropdowns when clicking outside
    document.addEventListener('click', () => {
        logoutDropdownDesktop.classList.add('hidden');
        logoutDropdownMobile.classList.add('hidden');
    });

    logoutBtnDesktop.addEventListener('click', handleLogout);
    logoutBtnMobile.addEventListener('click', handleLogout);

</script>
